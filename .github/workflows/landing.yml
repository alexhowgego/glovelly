name: Deploy Glovelly landing site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/landing.yml"
      - ".firebaserc"
      - "firebase.json"
      - "frontend/glovelly-landing/**"
  pull_request:
    paths:
      - ".github/workflows/landing.yml"
      - ".firebaserc"
      - "firebase.json"
      - "frontend/glovelly-landing/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/glovelly-landing/package-lock.json

      - name: Restore landing dependencies
        run: npm --prefix frontend/glovelly-landing ci

      - name: Build landing site
        run: npm --prefix frontend/glovelly-landing run check && npm --prefix frontend/glovelly-landing run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy preview channel
        id: preview
        run: |
          set -o pipefail
          npx --yes firebase-tools hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --only landing --expires 7d --project "${{ vars.GCP_PROJECT_ID }}" --json 2> >(tee /dev/stderr) | tee deployment.raw.json
          node -e 'const fs = require("node:fs"); const raw = fs.readFileSync("deployment.raw.json", "utf8"); const start = raw.indexOf("{"); if (start < 0) throw new Error("Firebase CLI did not produce JSON output."); const deployment = JSON.parse(raw.slice(start)); fs.writeFileSync("deployment.json", JSON.stringify(deployment));'

      - name: Publish preview URL
        uses: actions/github-script@v8
        with:
          script: |
            const deployment = require(`${process.env.GITHUB_WORKSPACE}/deployment.json`)
            const url = deployment.result?.url ?? deployment.result?.landing?.url ?? deployment.result?.['glovelly-landing']?.url
            if (url) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `Landing preview: ${url}`,
              })
            }

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/glovelly-landing/package-lock.json

      - name: Restore landing dependencies
        run: npm --prefix frontend/glovelly-landing ci

      - name: Build and check landing site
        run: npm --prefix frontend/glovelly-landing run check && npm --prefix frontend/glovelly-landing run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy landing site
        run: npx --yes firebase-tools deploy --only hosting:landing --project "${{ vars.GCP_PROJECT_ID }}"
