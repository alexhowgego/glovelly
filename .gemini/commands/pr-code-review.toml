description = "Reviews the current pull request"

prompt = """
<CONTEXT>
GitHub repository: $REPOSITORY
Pull request number: $PULL_REQUEST_NUMBER
Additional user instructions: $ADDITIONAL_CONTEXT
</CONTEXT>

<OBJECTIVE>
Perform a focused engineering review of the pull request.

Identify only concrete issues introduced or exposed by the changed code that would materially improve the pull request before merge.
</OBJECTIVE>

<TOOL_BUDGET>
Work within a budget of 16 tool calls.

Reserve enough tool calls to publish the final review.

Use `mcp_github_pull_request_read` exactly once to retrieve the pull request metadata and diff.

Inspect only changed files and, where necessary to verify a specific suspected issue, the nearest referenced types, functions, configuration, or tests using the native file tools.

Do not:
- scan the whole repository
- inspect unrelated files merely to search for additional issues
- run shell commands
- retry a failed tool call
- call `activate_skill`
- use GitHub tools other than the exact `mcp_github_*` tools available in this session
</TOOL_BUDGET>

<REVIEW_CRITERIA>
Report only:
- demonstrable correctness bugs
- security vulnerabilities
- performance regressions
- significant maintainability problems

Do not report:
- style preferences
- naming suggestions
- formatting issues
- speculative concerns
- undocumented product assumptions
- pre-existing issues not introduced or exposed by this pull request
- duplicate manifestations of the same root cause

Only raise a finding when the changed code and available context establish a concrete failure mode.

Prefer no findings over weak or speculative findings.
</REVIEW_CRITERIA>

<SEVERITY>
Classify each finding as:

- CRITICAL: catastrophic security, data loss, or system-wide failure risk
- HIGH: likely production failure or serious vulnerability
- MEDIUM: concrete defect with meaningful but limited impact
- LOW: genuine maintainability risk; never use LOW for stylistic preferences
</SEVERITY>

<COMMENT_RULES>
For every finding:

- explain the concrete failure mode
- explain why it matters
- keep the wording concise
- attach the comment only to a changed diff line
- use the correct LEFT or RIGHT diff side
- do not repeat the same issue
- include a code suggestion only when the replacement is precise and complete
</COMMENT_RULES>

<SUBMIT_REVIEW>
If inline findings exist:

1. Call `mcp_github_pull_request_review_write` to create a pending review.
2. Call `mcp_github_add_comment_to_pending_review` once per distinct finding.
3. Call `mcp_github_pull_request_review_write` again to submit the pending review with event type `COMMENT`.

For an inline finding, use this format:

[SEVERITY] Concise description of the concrete issue and its impact.

When a precise replacement is appropriate, append:

```suggestion
replacement code
```

If no actionable issues are found, submit a COMMENT review stating:

No actionable issues were found in the changed code.
</SUBMIT_REVIEW>
"""
